<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TorrServer Stream</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .file-drop-area {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      background: var(--panel-bg);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .file-drop-area:hover {
      border-color: var(--accent);
      background: var(--card-bg);
    }
    .file-input {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-area">
      <span class="logo-badge">P2P</span>
      <span>TorrServer Stream</span>
    </div>
  </header>

  <main>
    <section class="view active" style="padding-top: 10px;">
      <div class="settings-group">
        <div class="group-title" style="margin-bottom: 12px; font-size: 14px;">Перетащите .torrent файл сюда</div>
        
        <div class="file-drop-area" id="dropArea" style="border: 2px dashed var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 180px; padding: 10px; cursor: pointer; border-radius: 10px; transition: all 0.2s ease;">
          <div style="font-size: 38px; margin-bottom: 12px;">📥</div>
          <div id="fileLabel" style="font-weight: 600; font-size: 15px; color: #fff; text-align: center;">
            Перетащите .torrent файл из Finder
          </div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
            или нажмите здесь для выбора файла
          </div>
        </div>
      </div>

      <div id="loaderArea" class="loader-area" style="display: none; margin-top: 20px;">
        <div class="loader-spinner"></div>
        <div id="loaderText">Подключение к TorrServer...</div>
      </div>

      <div id="fileListContainer" style="display: none; margin-top: 20px;">
        <div class="group-title" id="torrentTitle" style="margin-bottom: 12px;">Файлы в торренте</div>
        <div id="resultsList" class="results-list"></div>
      </div>
      
      <div id="emptyState" style="text-align: center; color: var(--text-muted); padding: 40px 10px; display: none;"></div>
    </section>
  </main>

  <script src="ui.js"></script>
</body>
</html>
